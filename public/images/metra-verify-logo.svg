<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Weighing Scale Group -->
  <g transform="translate(10, 5)">
    <!-- Top Weighing Pan -->
    <rect x="24" y="6" width="72" height="11" rx="5.5" fill="#FFFFFF" stroke="#0A2558" stroke-width="5"/>
    
    <!-- Scale Neck -->
    <rect x="48" y="17" width="24" height="13" fill="#F8FAFC" stroke="#0A2558" stroke-width="5"/>
    
    <!-- Scale Feet -->
    <rect x="14" y="94" width="14" height="8" rx="4" fill="#0A2558"/>
    <rect x="92" y="94" width="14" height="8" rx="4" fill="#0A2558"/>
    
    <!-- Scale Base Trapezoid -->
    <path d="M 37 30 L 83 30 C 86.5 30 89.5 32 91 35.5 L 109 82 C 111.5 88 107 94 100.5 94 L 19.5 94 C 13 94 8.5 88 11 82 L 29 35.5 C 30.5 32 33.5 30 37 30 Z" fill="#FFFFFF" stroke="#0A2558" stroke-width="5.5" stroke-linejoin="round"/>
    
    <!-- Digital Screen -->
    <rect x="32" y="56" width="56" height="26" rx="5" fill="#0056B3" stroke="#0A2558" stroke-width="3.5"/>
    <rect x="34" y="58" width="52" height="22" rx="3" fill="#0066CC"/>
    <text x="60" y="74" fill="#FFFFFF" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" letter-spacing="0.8">0.00</text>
    
    <!-- Certified Checkmark Circle Badge -->
    <circle cx="93" cy="82" r="22" fill="#FFFFFF"/>
    <circle cx="93" cy="82" r="18.5" fill="#00B074"/>
    <path d="M 85 82 L 91 88 L 102 76" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Lockup -->
  <g transform="translate(150, 42)">
    <text x="0" y="0" fill="#0A2558" font-size="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" letter-spacing="-0.8">METRA</text>
    <text x="0" y="38" fill="#00B074" font-size="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" letter-spacing="-0.8">VERIFY</text>
    <text x="2" y="62" fill="#556677" font-size="13" font-family="'Inter', sans-serif" font-weight="500">Trusted Weights. Verified Always.</text>
  </g>
</svg>
